		<script>
		localStorage.setItem("consentPermission","false");
		window.ConsentChecksum = "a69b7510e8319c5d8ad200a4fe5f706d_v1";
		window.consentCodeBuffer = window.consentCodeBuffer || [];

		window.setConsentCookie = function( cvalue ) {
			const d = new Date();
			const cname = "Consent";
			const exdays = 365;

			d.setTime(d.getTime() + (exdays*24*60*60*1000));
			let expires = "expires="+ d.toUTCString();
			document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
		}

		window.getConsentCookie = function( ) {
			let cname = "Consent";
			let name = cname + "=";
			let decodedCookie = decodeURIComponent(document.cookie);
			let ca = decodedCookie.split(';');

			for(let i = 0; i <ca.length; i++) {
				let c = ca[i];
				while (c.charAt(0) == ' ') {
					c = c.substring(1);
				}
				if (c.indexOf(name) == 0) {
					return c.substring(name.length, c.length);
				}
			}
			return "";
		}

		window.deleteConsentCookie = function( ) {
			let cname = "Consent";
			document.cookie = cname + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
		}

		window.releaseConsentBuffer = function() {			

			let buffer = window.consentCodeBuffer;
			const tempContainer = document.createElement('div');

			window.onerror = function (error, url, line, column, stack) {

				let fetch_url = "/api/codes/error/?" + new URLSearchParams({
					error_message: error,
					error_url: url,
				}).toString()

				fetch(fetch_url).then(function(response) {
				
				}).catch(function(err) {

				});
	        };

			for (var i = 0; i < buffer.length; i++) {
				let code_element = buffer[i];

				if ( code_element.released === true ) {
					console.log("[releaseConsentBuffer] skip double execution");
					continue;
				}

				if ( code_element.type == "javascript" ) {
	
					(function() {
						code_element.callback.call();
						//eval(code_element.callback);
					})();

				} else if ( code_element.type == "src" ) {
					var s = document.createElement('script');
					s.type = 'text/javascript';
					s.async = true;
					s.src = code_element.src;
					document.body.appendChild(s);
				}
				else if ( typeof code_element.content == "string" ) {
					
					if ( code_element.content !== undefined  ) {
						code_element.content = code_element.content.replace(/script_blocker/g, 'script');
						tempContainer.innerHTML += code_element.content;
					}
					
				}

				code_element.released = true;
			}

			let code_items = tempContainer.children;	
			

			for (let child of Array.from(code_items) ) {
			
				let error;
								
				if ( child.tagName === 'SCRIPT' ) {
					
					const newScript = document.createElement('script');
					if ( child.src ) {
						// Externe Skripte
						if (child.type) {
							newScript.type = child.type; // Type übernehmen
						}
						newScript.async = true; // Standardmäßig async laden
						newScript.src = child.src;
					} else {
						// Inline-Skripte
						try {
							newScript.textContent = child.textContent;
						} catch ( err ) {
		                	// console.log( "Code Error", err )
		                }
					}
					document.body.appendChild(newScript);
				} else {
					document.body.appendChild(child);
				}
                

               
            
			}

			window.onerror = null;

		}
		window.runInlineScriptsConsent = function(container, html) {
			const tpl = document.createElement('template');
			tpl.innerHTML = html;

			const scripts = tpl.content.querySelectorAll('script_blocker');

			container.innerHTML = '';
			container.appendChild(tpl.content);

			scripts.forEach(oldScript => {
				const s = document.createElement('script');

				// Attribute kopieren (src, async, type, etc.)
				for (const { name, value } of Array.from(oldScript.attributes)) {
				s.setAttribute(name, value);
				}

				// Inline-Code kopieren
				if (!oldScript.src) {
				s.textContent = oldScript.textContent;
				}

				oldScript.replaceWith(s);
			});
		}
		window.releaseInlineBlocks = function() {

			if ( typeof window.runInlineScriptsConsent === "function" ) {
				
				const inlineblocks = document.querySelectorAll(".T330");

				inlineblocks.forEach(block => {
					const wrapper = block.querySelector(".placeholder");
					if ( wrapper !== null ) {
						if ( wrapper.dataset.script ) {
							window.runInlineScriptsConsent(wrapper, wrapper.dataset.script);
						}
					}
					
				});


			}

		}
		window.checkConsent = function() {

			let consent_html = document.querySelector(".TraminoConsent");

			if ( window.ConsentChecksum ) {
				if ( window.getConsentCookie() == window.ConsentChecksum ) {
						return true
					}
			}

			if ( consent_html !== null ) {
				if ( consent_html.dataset.checksum ) {
					if ( window.getConsentCookie() == consent_html.dataset.checksum ) {
						return true
					}
				}
			}

			return false;

		}


		window.checkReleaseConsent = function() {

			if ( window.checkConsent() ) {
				window.releaseConsentBuffer();
				localStorage.setItem("consentPermission","true");
				console.log("[checkReleaseConsent] granted - codes released");
			} else {
				localStorage.setItem("consentPermission","false");
				console.log("[checkReleaseConsent] not granted");
			}
		
		}
