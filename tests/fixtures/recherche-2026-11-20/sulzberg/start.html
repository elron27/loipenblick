<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sulzberg - Startseite</title>

    <link rel="stylesheet" type="text/css" href="https://cdnfile.gem2go.page/cdnstatic/system/CSSz/bootstrap/v5_2_0/bootstrap.min.css">

    <style>
        * {
            color: #212121;
        }

        .item {
            height: 100vh;
            background-size: cover;
        }

        .item:first-of-type {
            border-right: 5px solid #fff;
        }

        .item:hover {
            filter: brightness(70%);
        }

        .logo-wrapper {
            top: 20px;
            right: 20px;
            max-width: 250px;
            max-height: 150px;
        }

        img {
            max-width: inherit;
            max-height: inherit;
            object-fit: contain;
        }

        .text-wrapper {
            min-height: 15vh;
            bottom: 20px;
            left: 20px;
            right: 20px;
        }

        .text-wrapper > div {
            min-height: inherit;
        }

        .overlay-link {
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .link-wrapper {
            position: absolute;
            font-size: 0.9rem;
            right: 10px;
            bottom: 10px;
        }

        @media screen and (max-width: 768px) {
            .item {
                height: 50vh;
            }

            .item:first-of-type {
                border: none;
            }

            .link-wrapper {
                position: static;
            }

            .logo-wrapper {
                max-width: 150px;
                max-height: 100px;
            }
        }

    </style>
</head>
<body>
    <div class="d-flex flex-column flex-md-row">
        <div class="col-12 col-md-6 item position-relative" style="background-image: url(/system/web/getImage.ashx?fileid=1179261&width=1920&height=1920&mode=t); background-size: cover; background-position: center center;">
            <a class="overlay-link" href="https://www.sulzberg-bregenzerwald.com/" title="Zur Tourismusseite von Sulzberg">
                <div class="logo-wrapper position-absolute">
                    <img src="/system/web/getImage.ashx?fileid=1116730&mode=O" alt="Logo Tourismus Sulzberg" class="bg-light bg-opacity-75 p-2" />
                </div>
                
                <div class="text-wrapper position-absolute">
                    <div class="bg-light bg-opacity-75 p-3 position-relative mh-100">
                        <h2>
                            Tourismus Sulzberg
                        </h2>
                        
                        <div>
                            Erlebe Sulzberg und buche deinen Aufenthalt.
                        </div>

                        <div class="mt-3 mt-md-0 link-wrapper">
                            www.sulzberg-bregenzerwald.com
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-12 col-md-6 item position-relative" style="background-image: url(/system/web/getImage.ashx?fileid=1116733&mode=t&width=1920&height=1920); background-size: cover; background-position: center center;">
            <a class="overlay-link"  href="https://www.sulzberg.at/system/web/default.aspx" title="Zur Gemeindeseite von Sulzberg">
               <div class="logo-wrapper position-absolute">
                    <img src="/system/web/getImage.ashx?fileid=1116732&mode=O" alt="Wappen Gemeinde Sulzberg"/>
                </div>
        
                <div class="text-wrapper position-absolute">
                    <div class="bg-light bg-opacity-75 p-3">
                        <h2>
                            Gemeinde Sulzberg
                        </h2>

                        <div>
                            Informiere dich über Bürgerservice, Politik und unser Gemeindeleben.
                        </div>

                        <div class="mt-3 mt-md-0 link-wrapper">
                            www.sulzberg.at
                        </div>
                    </div>
                </div> 
            </a>
        </div>
    </div>
</body>
</html>
