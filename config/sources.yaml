  - key: oberstdorf
    adapter: tramino_wsb
    name: Tourismus Oberstdorf (Wintersportbericht)
    base_url: https://www.oberstdorf.de
    art: ortsseite
    schliesst: [oberstdorf]
    rang: 2
    strecke_hinweis: "Der Oberstdorfer Wintersportbericht nennt keinen Streckenverlauf und keine Koordinaten."
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-20, nutzungsbedingungen_geprueft: 2026-11-20, erlaubnis: nur_test,
              hinweis: "Impressum: Vervielfaeltigung und Verwertung nur mit schriftlicher Zustimmung, Kopien nur privat; Bericht ruht bis ca. Ende November"}
    config:
      pfad: /sommer/alpininfo/wintersportbericht/
      default_gebiet: oberstdorf

