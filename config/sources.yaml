# Quellen als Daten (P2): neue Orte kommen hier dazu, nicht in den Code.
# Der Worker liest diese Datei bei jedem Lauf neu, ein Neustart ist nicht noetig.
#
# Adapter:
#   ats     Tourismus-System von tegernsee.com, bayrischzell.de, fischbachau.de (/a-<slug>-Seiten)
#   aschau  Schneebericht-Seite von aschau.de (Sachrang)
#   (Schritt 3: tourinfra fuer den Chiemgau)

# Abrufzeiten (P8). Jede Quelle kann einen eigenen Block "zeitplan" haben.
zeitplan:
  saison: {von: "11-01", bis: "04-30"}
  saison_uhrzeiten: [7, 12, 17]
  nebensaison_uhrzeiten: [8]

quellen:
  - key: tegernsee
    adapter: ats
    name: Tegernseer Tal Tourismus
    base_url: https://www.tegernsee.com
    config:
      default_gebiet: tegernsee
      # Ortsname in Titel oder Text der Loipe -> Gebiet
      gebiet_map:
        Bad Wiessee: bad-wiessee
        Gmund: gmund
        Kreuth: kreuth
        Rottach-Egern: rottach-egern
        Tegernsee: tegernsee

  - key: bayrischzell
    adapter: ats
    name: Bayrischzell Tourismus
    base_url: https://www.bayrischzell.de
    config:
      default_gebiet: bayrischzell

  - key: fischbachau
    adapter: ats
    name: Fischbachau Tourismus
    base_url: https://www.fischbachau.de
    config:
      default_gebiet: fischbachau

  - key: sachrang
    adapter: aschau
    name: Aschau i. Chiemgau Schneebericht
    base_url: https://www.aschau.de
    config:
      report_path: /schneebericht-sachrang
      default_gebiet: sachrang
