# Quellen als Daten (P2): neue Orte kommen hier dazu, nicht in den Code.
# Der Worker liest diese Datei bei jedem Lauf neu, ein Neustart ist nicht noetig.
#
# Adapter:
#   ats     Tourismus-System von tegernsee.com, bayrischzell.de, fischbachau.de (/a-<slug>-Seiten)
#   aschau  Schneebericht-Seite von aschau.de (Sachrang)
#   tourinfra    JSON-Loipenmanager von Chiemgau Tourismus
#   tirolat      Landesportal tirol.at (Kartenliste + Detailseiten im Wechsel)
#   kitzalps     Loipenstatus-Seite der Kitzbueheler Alpen
#   langlaufdorf langlaufdorf.at (Faistenau, Hintersee)
#   stammdaten   nur Lage und Laenge, kein Zustand (berchtesgaden.de)
#   seefeld      Loipenbericht der Olympiaregion Seefeld (gespurte km je Loipe)
#   achensee     contwise-Schneebericht von achensee.com (gespurte km je Technik, Stand je Ort)
#   skidata      Skidata-Schneebericht von kufstein.com (Status je Loipe, Stand je Ort)
#   kaiserwinkl  Loipenbericht von kaiserwinkl.com (Status, Laenge, Stand der Liste)
#   dolomiti     Loipentabelle von Dolomiti NordicSki (Status in 5 Stufen, Laenge, ohne Datum und Lage)
#   opendatahub  Open Data Hub Suedtirol (JSON, CC0: Lage, Stile, offen/geschlossen mit Aenderungsdatum)
#
# Pflichtangaben je Quelle (P17, P20, D15):
#   nutzung: robots (erlaubt), robots_geprueft (Datum), nutzungsbedingungen_geprueft (Datum oder null =
#            noch offen, vor dem Oeffentlichschalten pruefen, Blindspot 6)
#   art:     portal oder ortsseite; eine Ortsseite nennt unter schliesst die Gebiete, die sonst keine Quelle hat
#   rang:    bei Dubletten gewinnt der kleinere Rang (1 = fuehrend), Standard 10. Ortsquellen mit
#            Praeparierdatum (2) vor tirol.at (3, nur offen/gesperrt) vor Kitzbueheler Alpen (4, ohne Koordinate).
#            Regionale Loipenberichte mit Datum (Tannheimer Tal) haben ebenfalls 2 (D18).
# Nicht abrufen (P17, E-15): salzkammergut.at (robots-Sperre), Intermaps (Bezahldienst), bergfex (robots).

# Abrufzeiten (P8). Jede Quelle kann einen eigenen Block "zeitplan" haben.
zeitplan:
  saison: {von: "11-01", bis: "04-30"}
  saison_uhrzeiten: [7, 12, 17]
  nebensaison_uhrzeiten: [8]

# Quellen-Waechter (B26): meldet per Mail und Push, wenn eine Quelle kaputt wirkt, meist weil sich
# die Webseite geaendert hat. Jede Quelle kann einen eigenen Block "waechter" haben, z. B.
# waechter: {aus: true} oder waechter: {einbruch_anteil: 0.3}.
#   bestaetigen      so viele auffaellige Abrufe hintereinander, bevor gemeldet wird (kurze Stoerung = kein Alarm)
#   einbruch_anteil  Einbruch, wenn weniger als dieser Anteil der ueblichen Anzahl kommt
#   einbruch_ab      Einbruch erst pruefen, wenn eine Quelle ueblicherweise mindestens so viele Loipen liefert
#   erinnern_h       laeuft ein Alarm weiter, hoechstens so oft erinnern (Stunden)
#   neu_normal_tage  liefert eine Quelle so lange stabil weniger, gilt das als neuer Normalwert
waechter: {bestaetigen: 2, einbruch_anteil: 0.5, einbruch_ab: 4, erinnern_h: 24, neu_normal_tage: 7}

