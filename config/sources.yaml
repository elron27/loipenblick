  - key: opendatahub
    adapter: opendatahub
    name: Open Data Hub Südtirol (LTS)
    base_url: https://tourism.api.opendatahub.com
    art: portal
    rang: 3
    strecke_hinweis: "Der Open Data Hub führt nur Start- und Zielpunkt der Loipe, keinen Streckenverlauf."
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-13, nutzungsbedingungen_geprueft: 2026-11-13,
              hinweis: "robots.txt fehlt (404) = keine Sperre; Lizenz CC0 je Datensatz (LicenseInfo)"}
    config:
      pfad: /v1/ODHActivityPoi?odhtagfilter=loipen&pagesize=400&language=de&removenullvalues=true
      default_gebiet: toblach
      # IsOpen gilt nur, wenn der Verein den Eintrag in diesem Zeitraum geaendert hat (Befund 13.11.2026)
      frisch_stunden: 48
      auslassen_muster: "^TEST\\b"
      radius_km: 12
      # Loipen mit Suedtiroler Tourismusverein: weiterer Umkreis (Kasern liegt 17 km von der Gebietsmitte)
      radius_verein_km: 20
      # Liegt eine Loipe naeher an einem dieser Punkte als am naechsten Gebiet, faellt sie weg:
      # Nauders fuehrt tirol.at, die Schweiz kommt spaeter ueber eigene Quellen
      ausschluss:
        - {name: Nauders, lat: 46.890, lon: 10.500}
        - {name: Val Müstair, lat: 46.620, lon: 10.360}
        - {name: Unterengadin, lat: 46.800, lon: 10.300}
        - {name: Zernez, lat: 46.700, lon: 10.100}
        - {name: Sillian, lat: 46.750, lon: 12.420}
        - {name: Cadore, lat: 46.460, lon: 12.480}
        # Cortina und Comelico: dort fuehrt Dolomiti NordicSki; der ODH nennt dieselben Loipen nur italienisch
        - {name: Cortina, lat: 46.560, lon: 12.140}
        - {name: Comelico, lat: 46.605, lon: 12.478}
      # Tourismusverein (LocationInfo.TvInfo) -> Gebiet; ohne Eintrag zaehlt der naechste Gebietsmittelpunkt
      verein_map:
