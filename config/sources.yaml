# Quellen als Daten (P2): neue Orte kommen hier dazu, nicht in den Code.
# Der Worker liest diese Datei bei jedem Lauf neu, ein Neustart ist nicht noetig.
#
# Adapter:
#   ats     Tourismus-System von tegernsee.com, bayrischzell.de, fischbachau.de (/a-<slug>-Seiten)
#   aschau  Schneebericht-Seite von aschau.de (Sachrang)
#   tourinfra    JSON-Loipenmanager von Chiemgau Tourismus
#   tirolat      Landesportal tirol.at (Kartenliste + Detailseiten im Wechsel)
#   kitzalps     Loipenstatus-Seite der Kitzbueheler Alpen
#   langlaufdorf langlaufdorf.at (Faistenau, Hintersee)
#   stammdaten   nur Lage und Laenge, kein Zustand (berchtesgaden.de)
#
# Pflichtangaben je Quelle (P17, P20, D15):
#   nutzung: robots (erlaubt), robots_geprueft (Datum), nutzungsbedingungen_geprueft (Datum oder null =
#            noch offen, vor dem Oeffentlichschalten pruefen, Blindspot 6)
#   art:     portal oder ortsseite; eine Ortsseite nennt unter schliesst die Gebiete, die sonst keine Quelle hat
#   rang:    bei Dubletten gewinnt der kleinere Rang (1 = fuehrend), Standard 10. Ortsquellen mit
#            Praeparierdatum (2) vor tirol.at (3, nur offen/gesperrt) vor Kitzbueheler Alpen (4, ohne Koordinate)
# Nicht abrufen (P17, E-15): salzkammergut.at (robots-Sperre), Intermaps (Bezahldienst), bergfex (robots).

# Abrufzeiten (P8). Jede Quelle kann einen eigenen Block "zeitplan" haben.
zeitplan:
  saison: {von: "11-01", bis: "04-30"}
  saison_uhrzeiten: [7, 12, 17]
  nebensaison_uhrzeiten: [8]

quellen:
  - key: tegernsee
    adapter: ats
    name: Tegernseer Tal Tourismus
    base_url: https://www.tegernsee.com
    art: portal
    rang: 2
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-09, nutzungsbedingungen_geprueft: null}
    config:
      # Schneebericht-Seiten mit dem Loipenzustand (aus der alten App uebernommen). Sie sind von der
      # Langlaufen-Liste nicht verlinkt und werden ueber den Namen den Touren zugeordnet.
      statusseiten:
        - a-golfplatzrunde-87-km
        - a-skitty-world-langlauf-parcours
        - a-sportplatzrunde-35-km-1
        - a-sportplatzrunde-17-km-schneebericht
        - a-verbindungsloipe
        - a-gasslerrunde-1
        - a-oedbergrunde-1
        - a-panoramablick-1
        - a-runde-hainzenhoehe-steinberg-1
        - a-verbindungsloipe-hainzenhoehe-steinberg
        - a-klamm-bayerwald-glashuette-109-km-klassisch
        - a-klamm-bayerwald-09-km-skating
        - a-klamm-bayerwald-skating
        - a-kreuth-scharling-skating-u-klassisch
        - a-kreuth-wildbad-kreuth-klassisch
        - a-nachtloipe-brunnbichl-skating-u-klassisch
        - a-ringseeloipe-42-km-skating-u-klassisch
        - a-rundkurs-point-skating-u-klassisch
        - a-sonnenloipe-scharling-oberhof-skating-u-klassisch
        - a-wildbad-kreuth-klamm-klassisch
        - a-suttenrunde-1
        - a-ellmaurunde-1
        - a-glocknerwiesn-1
        - a-gsotthaberrunde-1
        - a-gutfelderrunde-1
        - a-sonnenmoosrunde-1
      default_gebiet: tegernsee
      # Ortsname in Titel oder Text der Loipe -> Gebiet
      gebiet_map:
        Bad Wiessee: bad-wiessee
        Gmund: gmund
        Kreuth: kreuth
        Rottach-Egern: rottach-egern
        Tegernsee: tegernsee

  - key: bayrischzell
    adapter: ats
    name: Bayrischzell Tourismus
    base_url: https://www.bayrischzell.de
    art: ortsseite
    schliesst: [bayrischzell]
    rang: 2
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-09, nutzungsbedingungen_geprueft: null}
    config:
      # Schneebericht-Seiten mit dem Loipenzustand (aus der alten App uebernommen). Sie sind von der
      # Langlaufen-Liste nicht verlinkt und werden ueber den Namen den Touren zugeordnet.
      statusseiten:
        - a-kloo-ascher-runde-1
        - a-zipflwirt-hauswies-runde-1
        - a-bayrischzell-geitau-bayrischzell-1
        - a-bayrischzell-zipflwirt-bayrischzell-1
        - a-melkstatt-runde-2
        - a-mieseben-runde-2
        - a-streinalm-runde-1
        - a-ursprungrunde
        - a-nessler-runde-1
      default_gebiet: bayrischzell

  - key: fischbachau
    adapter: ats
    name: Fischbachau Tourismus
    base_url: https://www.fischbachau.de
    art: ortsseite
    schliesst: [fischbachau]
    rang: 2
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-09, nutzungsbedingungen_geprueft: null}
    config:
      # Schneebericht-Seiten mit dem Loipenzustand (aus der alten App uebernommen). Sie sind von der
      # Langlaufen-Liste nicht verlinkt und werden ueber den Namen den Touren zugeordnet.
      statusseiten:
        - a-point-hundham-1
        - a-schreyern-runde-1
        - a-hundham-kleine-uebungsrunde-1
        - a-kleine-schreiern-runde-1
        - a-lippmuehlenrunde-1
        - a-zipflwirt-hauswies-runde-1
      default_gebiet: fischbachau

  - key: sachrang
    adapter: aschau
    name: Aschau i. Chiemgau Schneebericht
    base_url: https://www.aschau.de
    art: ortsseite
    schliesst: [sachrang]
    rang: 2
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-09, nutzungsbedingungen_geprueft: null}
    config:
      report_path: /schneebericht-sachrang
      default_gebiet: sachrang
      # Stammdaten, die die Seite nicht liefert (aus der alten App uebernommen)
      stammdaten:
        Bergerfeld: {laenge_km: 1.7, schwierigkeit: blau, nachtloipe: false, lat: 47.7105, lon: 12.2425}
        Langlaufrundkurs Lengauer Feld: {rundkurs: true, laenge_km: 3.1, schwierigkeit: rot, nachtloipe: false, lat: 47.6930, lon: 12.2680}
        Nachtloipe: {laenge_km: 3.0, schwierigkeit: blau, nachtloipe: true, lat: 47.6930, lon: 12.2680}
        Priental Loipe: {laenge_km: 8.0, schwierigkeit: rot, nachtloipe: false, lat: 47.7334, lon: 12.3036}

  # Chiemgau: eine JSON-Abfrage liefert Ruhpolding, Reit im Winkl, Inzell, Achental, Bergen, Siegsdorf, Chieming.
  - key: chiemgau
    adapter: tourinfra
    name: Chiemgau Tourismus (tourinfra Loipenmanager)
    base_url: https://module.tourinfra.com/chiemgau
    art: portal
    rang: 2
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-09, nutzungsbedingungen_geprueft: null}
    config:
      json_path: /inc/ajax.php?ajaxtype=getLoipenmanager
      default_gebiet: chieming
      gebiet_map:
        Ruhpolding: ruhpolding
        Reit im Winkl: reit-im-winkl
        Inzell: inzell
        Schleching: schleching
        Unterwössen: unterwoessen
        Marquartstein: marquartstein-grassau
        Grassau: marquartstein-grassau
        Bergen: bergen
        Siegsdorf: siegsdorf
        Chieming: chieming

  # Ausbaustufe 1 (E-15): Tirol ueber das Landesportal, Stufe 1 = Kufsteinerland, Kaiserwinkl, Wilder Kaiser.
  # Weitere Tiroler Regionen (Richtung Innsbruck): Gebiete mit lat/lon in gebiete.yaml anlegen und hier
  # unter gebiete eintragen, ohne Codeaenderung (P14 AK 2). Je Lauf 2 Abrufe fuer den Status von ganz Tirol
  # plus hoechstens details_pro_lauf Detailseiten.
  - key: tirol
    adapter: tirolat
    name: Tirol Werbung (tirol.at)
    base_url: https://www.tirol.at
    art: portal
    rang: 3
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-12, nutzungsbedingungen_geprueft: null,
              hinweis: "GPX auf tirol.mapservices.eu per robots.txt gesperrt, daher kein Streckenverlauf"}
    config:
      default_gebiet: kufstein
      # Jede Loipe gehoert zum naechsten Gebiet dieser Liste, wenn es naeher als radius_km liegt.
      # Ganz Tirol (P14 AK 2): 701 Loipen der Karte; dazu Bayrischzell, das tirol.at mitfuehrt
      # (dort fuehrt die Ortsquelle, D15). Die Kitzbueheler Gebiete melden auch kitzbueheler-alpen.
      radius_km: 15
      # 701 Loipen / 40 je Lauf: alle Detailseiten in gut 6 Tagen (3 Laeufe am Tag), dann im Wechsel neu
      details_pro_lauf: 40
      gebiete: [kufstein, thiersee, langkampfen, bad-haering, schwoich, ebbs, niederndorf,
                walchsee, koessen, schwendt, ellmau, going, soell,
                brixental, hohe-salve, pillerseetal, st-johann-in-tirol, bayrischzell,
                alpbachtal, wildschoenau, zillertal-fuegen, zell-gerlos, mayrhofen, tux, achensee, steinberg-rofan,
                hinterriss, silberregion-karwendel, innsbruck, hall-wattens, sellraintal, kuehtai,
                stubai, stubaier-gletscher, wipptal, seefeld, leutasch, mieming, oetztal, soelden,
                obergurgl, vent, pitztal, pitztaler-gletscher, imst, kaunertal, landeck,
                serfaus-fiss-ladis, tiroler-oberland, paznaun, st-anton, reutte, weissenbach, berwang,
                tannheimer-tal, jungholz, lechtal, stanzach, warth, namlos, zugspitz-arena,
                kitzbuehel, jochberg, osttirol-lienz, hochpustertal, obertilliach, defereggental,
                matrei, kals]

  # Kitzbueheler Alpen: eine Seite mit Brixental, Hohe Salve, Pillerseetal und St. Johann (P15).
  - key: kitzbueheler-alpen
    adapter: kitzalps
    name: Kitzbüheler Alpen Loipenstatus
    base_url: https://www.kitzbueheler-alpen.com
    art: portal
    rang: 4
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-12, nutzungsbedingungen_geprueft: null}
    config:
      pfad: /de/bri/aktuelles/loipen-status.html
      default_gebiet: brixental
      regionen:
        Brixental: brixental
        Hohen Salve: hohe-salve
        Pillerseetal: pillerseetal
        St. Johann: st-johann-in-tirol

  # Salzburger Umland (P16): Ortsseite, weil Faistenau und Hintersee sonst keine Quelle haben (P20).
  - key: langlaufdorf
    adapter: langlaufdorf
    name: Langlaufdorf Faistenau / Hintersee
    base_url: https://www.langlaufdorf.at
    art: ortsseite
    schliesst: [faistenau, hintersee]
    rang: 2
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-12, nutzungsbedingungen_geprueft: null}
    config:
      pfad: /
      default_gebiet: faistenau
      gebiet_map:
        Hintersee: hintersee

  # Berchtesgadener Land: nur Stammdaten, die Seite meldet keinen Zustand (P16 AK 2).
  - key: berchtesgaden
    adapter: stammdaten
    name: Bergerlebnis Berchtesgaden
    base_url: https://www.berchtesgaden.de
    art: portal
    rang: 8
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-12, nutzungsbedingungen_geprueft: null}
    zeitplan:
      # Stammdaten aendern sich selten: einmal am Tag reicht (P19)
      saison_uhrzeiten: [7]
      nebensaison_uhrzeiten: [7]
    config:
      default_gebiet: berchtesgaden
      seiten:
        - {pfad: /touren/langlaufloipen-schoenau-am-koenigssee, gebiet: schoenau-am-koenigssee}
        - {pfad: /touren/langlaufloipen-taubensee-ramsau, gebiet: ramsau}
        - {pfad: /pois/langlaufzentrum-aschauerweiher-bischofswiesen, gebiet: bischofswiesen, laenge_km: 16}
        - {pfad: /pois/langlaufloipen-scharitzkehl, gebiet: berchtesgaden, laenge_km: 9}
        - {pfad: /touren/langlaufloipen-oberau-bei-berchtesgaden, gebiet: berchtesgaden}
        - {pfad: /touren/langlaufloipen-scheffau-schellenberg, gebiet: marktschellenberg}
