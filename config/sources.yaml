    rang: 2
    strecke_hinweis: "Der Schneebericht der Hörnerdörfer nennt nur Ort, Status und Länge, keinen Streckenverlauf."
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-20, nutzungsbedingungen_geprueft: 2026-11-20, erlaubnis: nur_test,
              hinweis: "robots.txt fehlt (404) = keine Sperre; Impressum hoernerdoerfer.de: Nutzung der Daten zu anderen Zwecken nur mit schriftlicher Zustimmung",
              p17_ausnahme: "Stefan 19.11.2026: Intermaps nur fuer die Testversion, vor dem Livegang Erlaubnis einholen"}
    config:
      pfad: /hoernerdoerfer_srm/hoernerdoerfer.aspx
      default_gebiet: hoernerdoerfer
      gebiet_map:
