        Stern - St.Kassian - Abtei: alta-badia
        Villnöss: villnoess
        Ratschings: ratschings
        Sterzing, Pfitsch und Freienfeld: pfitsch
        Gossensass: gossensass
        Sarntal: sarntal
        Ritten: ritten-villanders
        Klausen, Barbian, Feldthurns & Villanders: ritten-villanders
        Eggental Tourismus: deutschnofen-welschnofen
