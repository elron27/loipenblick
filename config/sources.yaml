        - {pfad: /touren/langlaufloipen-oberau-bei-berchtesgaden, gebiet: berchtesgaden}
        - {pfad: /touren/langlaufloipen-scheffau-schellenberg, gebiet: marktschellenberg}

  # Suedtirol (E-18, 13.11.2026). Dolomiti NordicSki meldet den Status je Loipe in fuenf Stufen (Rang 2),
  # aber ohne Datum und ohne Lage; der Open Data Hub liefert ganz Suedtirol mit Startpunkt und
  # offen/geschlossen (Rang 3). Bei derselben Loipe fuehrt Dolomiti NordicSki, die Lage kommt vom ODH.
  - key: dolomiti-nordicski
    adapter: dolomiti
    name: Dolomiti NordicSki (Loipenstatus)
    base_url: https://www.dolomitinordicski.com
    art: portal
    rang: 2
    strecke_hinweis: "Dolomiti NordicSki zeigt die Strecken nur in einer Karte, deren Daten per robots.txt gesperrt sind; der Startpunkt kommt vom Open Data Hub."
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-13, nutzungsbedingungen_geprueft: null,
              hinweis: "Impressum ohne Nutzungsregeln; vor dem Oeffentlichschalten beim Komitee fragen"}
    config:
      # eine Seite zeigt alle Regionen; der Regionsfilter wirkt nur im Browser
      pfad: /de/regionen/alta-badia/geoeffnete-loipen/2.html
      default_gebiet: toblach
      # gleiche Loipe, anderer Name als im Open Data Hub (D15)
      namen_ersatz:
        "Loipe Südtirol Arena": "Loipe Biathlonzentrum"
      # Osttirol: dort fuehrt tirol.at alle Loipen, Dolomiti NordicSki nur die der Mitgliedsorte
      auslassen: [Sillian, Heinfels, Strassen, Villgraten, Tristach, Lavant, Nikolsdorf, Prägraten, Virgen,
                  Matrei, Kals, Defereggen, St. Jakob i.D., St.Jakob i.D., Kartitsch, Obertilliach, Untertilliach,
                  Grenzlandloipe, Biathlonzentrum Wettkampf]
