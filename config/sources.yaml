  # Chiemgau GmbH (Frau Tremel) am 20.11.2026: keine Freigabe, bis intern und mit dem Systemanbieter
  # (green-solutions, tourinfra) geklaert ist; Bitte, die Loipenmanager-Daten vorerst nicht zu uebernehmen.
  # Darum nur_test, bis eine Zustimmung vorliegt (docs/kontaktliste.md).
  - key: chiemgau
    adapter: tourinfra
    name: Chiemgau Tourismus (tourinfra Loipenmanager)
    base_url: https://module.tourinfra.com/chiemgau
    art: portal
    rang: 2
    nutzung: {robots: erlaubt, robots_geprueft: 2026-11-09, nutzungsbedingungen_geprueft: null, erlaubnis: nur_test,
              hinweis: "Chiemgau GmbH 20.11.2026: Freigabe ausstehend, Daten vorerst nicht uebernehmen"}
    config:
      json_path: /inc/ajax.php?ajaxtype=getLoipenmanager
      default_gebiet: chieming
      gebiet_map:
