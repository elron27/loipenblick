# Handdaten der Gebiete (D7, D8, U14, U26, D11, D13).
# Werte der Quelle haben Vorrang; hier steht, was die Quellen nicht liefern.
# Fehlt eine Gebuehr, bleibt das Feld leer: das heisst "unbekannt", nicht "kostenlos".
# Jede Angabe nennt ihre Quelle (url). Stand der Recherche: 09.11.2026.
# koordinate_geschaetzt: true = die Koordinate ist der Loipenstart laut tourinfra, kein bestaetigter Parkplatz.
# parkplaetze_ohne_koordinate: bekannt, aber ohne Koordinate; wird nicht angezeigt, bis eine nachgetragen ist.
# hoehe_m: Hoehe des Ortes ueber NN in Metern (gerundet, Naeherung), bestimmt das Talprofil der Startseite.
# wetterstation: DWD-Station mit Schneehoehe (SH_TAG), siehe Recherche wetterstationen.md.
#   In Oesterreich mit dienst: geosphere eine Station aus GeoSphere klima-v2-1d (Parameter sh, D17).
# Regionen: land (DE, AT, IT) und bundesland (D16); das Gebiet erbt beides von seiner Region.
# grenzinfo: Hinweis fuer die Anfahrt aus Bayern (U31), von Hand gepflegt wie die Parkplaetze.
# namen: weitere Namen je Sprache (P12), z. B. {it: Dobbiaco}.
# Ausbaustufe 1 (E-15, Stand 12.11.2026): Gebietsmitten aus den Loipenstarts von tirol.at bzw.
