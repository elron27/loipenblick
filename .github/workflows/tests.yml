name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loipen
          POSTGRES_PASSWORD: loipen
          POSTGRES_DB: loipen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loipen" --health-interval 5s --health-retries 10
    env:
      LOIPEN_TEST_DATABASE_URL: postgresql+psycopg://loipen:loipen@localhost:5432/loipen_test
      REQSEQ_VERSION: 0.8.3
      REQSEQ_SHA256: cc6f7e579cd0615fdac37d6b49b77ba65af66bb99fe1cc640049f45dac4f583d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Browser fuer die Oberflaechen-Tests
        run: playwright install --with-deps chromium
      - name: Tests (P9, Testkonzept)
        run: pytest -q --junitxml=junit.xml -o junit_family=xunit1
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 22
      - name: ReqSeq installieren
        if: always()
        run: |
          curl -sSL -o reqseq-cli.tgz "https://github.com/ThomasBirkmaier/ReqSeq/releases/download/v${REQSEQ_VERSION}/reqseq-cli-${REQSEQ_VERSION}.tgz"
          echo "${REQSEQ_SHA256}  reqseq-cli.tgz" | sha256sum -c -
          npm install -g --offline --ignore-scripts ./reqseq-cli.tgz
      - name: Nachweise mit den Anforderungen verknüpfen
        if: always()
        run: |
          reqseq evidence enrich-junit junit.xml "${GITHUB_SHA::12}" --workspace spec --output spec/evidence/junit-ci.xml
          reqseq evidence coverage --workspace spec --filter version-1 >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-reqseq
          path: spec/evidence/junit-ci.xml

  # B4: Image bauen und den ganzen Stack wie auf dem NAS starten, aber mit Attrappe statt echter
  # Quellen und lokalem ntfy (docs/testumgebung.md). Ersetzt den Handtest am NAS fuer
  # Start, Lauf, Seite, Push, Sicherung/Wiederherstellung und Neustart.
  stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compose-Datei fuer das NAS ist gueltig
        run: cp .env.example .env && docker compose config -q && rm .env
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Browser fuer die Bildschirmfotos
        run: playwright install --with-deps chromium
      - name: Teststack bauen, starten, pruefen
        run: python scripts/teststack.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teststack
          path: |
            .teststack/screenshots/
            .teststack/logs/
            .teststack/junit-stack.xml
            .teststack/site/
          if-no-files-found: ignore
