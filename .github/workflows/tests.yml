name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loipen
          POSTGRES_PASSWORD: loipen
          POSTGRES_DB: loipen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loipen" --health-interval 5s --health-retries 10
    env:
      LOIPEN_DATABASE_URL: postgresql+psycopg://loipen:loipen@localhost:5432/loipen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Migrationen gegen PostgreSQL
        run: alembic upgrade head && alembic check
